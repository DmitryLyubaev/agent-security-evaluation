[project]
name = "agent-security-evaluation"
version = "0.1.0"
description = "Bounded synthetic agent-security and human-review study"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi", "pydantic>=2,<3", "uvicorn"]

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[project.scripts]
agent-security = "agent_security_evaluation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

